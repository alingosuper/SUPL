<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a9b4a"/>
      <stop offset="50%" stop-color="#0e7a35"/>
      <stop offset="100%" stop-color="#064a1f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce38a"/>
      <stop offset="40%" stop-color="#f5c242"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e6a700"/>
    </linearGradient>
  </defs>

  <!-- بائیں سبز "نما" حرف -->
  <path d="M 30 110 Q 30 60 80 60 L 160 60 Q 200 60 200 100 Q 200 140 160 140 L 110 140 L 110 100 Q 110 90 120 90 L 160 90 Q 170 90 170 100 Q 170 110 160 110 L 120 110" 
        fill="none" stroke="url(#greenGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- سنہری انسانی شکل -->
  <circle cx="250" cy="60" r="22" fill="url(#headGrad)"/>
  <path d="M 220 95 Q 250 80 280 95 Q 320 130 350 40 Q 300 90 280 150 Q 260 200 220 230" 
        fill="url(#goldGrad)" stroke="#b8860b" stroke-width="1"/>

  <!-- دائیں سبز حرف -->
  <path d="M 300 90 Q 350 90 360 140 Q 370 200 320 220 L 260 220 Q 220 220 220 180" 
        fill="none" stroke="url(#greenGrad)" stroke-width="20" stroke-linecap="round"/>
</svg>
