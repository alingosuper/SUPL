<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlinGo Developers">
  <title>AlinGo Developers</title>
  <desc>اپنی زبان، اپنا کوڈ، اپنی پہچان</desc>

  <!-- ═══ بائیں: مکمل لوگو ═══ -->
  <g transform="translate(60, 40) scale(1.75)">
    <!-- چھت / Roof -->
    <polygon points="160,12 40,88 160,34 280,88" fill="#0a3a82"/>
    <polygon points="160,38 55,95 160,54 265,95" fill="#1884e8"/>

    <!-- کھڑکیاں / Windows -->
    <rect x="142" y="64" width="15" height="15" fill="#0a3a82"/>
    <rect x="163" y="64" width="15" height="15" fill="#0a3a82"/>
    <rect x="142" y="84" width="15" height="15" fill="#0a3a82"/>
    <rect x="163" y="84" width="15" height="15" fill="#0a3a82"/>

    <!-- AlinGo wordmark -->
    <text x="160" y="168" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="82">
      <tspan fill="#0a3a82">Alin</tspan><tspan fill="#2d8a22">Go</tspan>
    </text>

    <!-- DEVELOPERS banner -->
    <rect x="25" y="182" width="270" height="48" rx="24" fill="#0c52b5"/>
    <text x="160" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="26" letter-spacing="3" fill="#ffffff">DEVELOPERS</text>

    <!-- نعرہ / Tagline -->
    <text x="160" y="286" text-anchor="middle" font-family="Noto Nastaliq Urdu, Jameel Noori Nastaleeq, Alvi Nastaleeq, Segoe UI, Tahoma, serif" font-weight="bold" font-size="22" fill="#0a3a82">اپنی زبان، اپنا کوڈ، اپنی پہچان</text>
  </g>

  <!-- ═══ درمیان: جدا کرنے والی لکیر ═══ -->
  <line x1="720" y1="140" x2="720" y2="480" stroke="#0a3a82" stroke-width="1.5" opacity="0.15"/>

  <!-- ═══ دائیں: AlinGo Developers (انگریزی + اردو) ═══ -->
  <g>
    <!-- AlinGo بڑا -->
    <text x="1060" y="230" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="130">
      <tspan fill="#0a3a82">Alin</tspan><tspan fill="#2d8a22">Go</tspan>
    </text>

    <!-- DEVELOPERS کھلا -->
    <text x="1060" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="32" letter-spacing="8" fill="#0a3a82">DEVELOPERS</text>

    <!-- چھوٹی لکیر -->
    <line x1="900" y1="350" x2="1220" y2="350" stroke="#2d8a22" stroke-width="2" opacity="0.5"/>

    <text x="1060" y="470" text-anchor="middle" font-family="Noto Nastaliq Urdu, Jameel Noori Nastaleeq, Alvi Nastaleeq, Segoe UI, Tahoma, serif" font-weight="bold" font-size="52" fill="#0a3a82">النگو ڈویلپرز</text>
  </g>
</svg>