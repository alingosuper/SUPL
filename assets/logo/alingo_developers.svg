<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlinGo Developers">
  <title>AlinGo Developers</title>
  <desc>اپنی زبان، اپنا کوڈ، اپنی پہچان</desc>

  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1568DB"/>
      <stop offset="100%" stop-color="#0A3A82"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A3A82"/>
      <stop offset="100%" stop-color="#062966"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════
       MARK / نشان — House + A Monogram
       ═══════════════════════════════════════ -->
  <g transform="translate(250, 130)">
    <!-- Roof (A-shape) -->
    <polygon points="0,-105 -120,10 120,10" fill="url(#roofGrad)"/>
    <!-- Roof inner accent (darker) -->
    <polygon points="0,-70 -85,10 85,10" fill="#0A3A82"/>

    <!-- Building body -->
    <rect x="-100" y="10" width="200" height="145" rx="4" fill="url(#bodyGrad)"/>

    <!-- Floor separator (green accent) -->
    <rect x="-100" y="78" width="200" height="12" fill="#2D8A22"/>

    <!-- Windows row -->
    <rect x="-72" y="28" width="44" height="38" rx="3" fill="#1884E8"/>
    <rect x="28" y="28" width="44" height="38" rx="3" fill="#1884E8"/>

    <!-- Door -->
    <rect x="-28" y="105" width="56" height="50" rx="3" fill="#1568DB" opacity="0.7"/>
    <circle cx="18" cy="132" r="3" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- ═══════════════════════════════════════
       WORDMARK / لفظی نشان
       ═══════════════════════════════════════ -->
  <text x="250" y="420" text-anchor="middle"
        font-family="'Inter', 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-weight="800" font-size="88" letter-spacing="-5">
    <tspan fill="#0A3A82">Alin</tspan><tspan fill="#2D8A22">Go</tspan>
  </text>

  <!-- Descriptor / وضاحت -->
  <text x="250" y="462" text-anchor="middle"
        font-family="'Inter', 'Manrope', sans-serif"
        font-weight="500" font-size="15" letter-spacing="14" fill="#0A3A82" opacity="0.7">
    DEVELOPERS
  </text>

  <!-- Divider / جدا کرنے والی لکیر -->
  <line x1="185" y1="490" x2="315" y2="490" stroke="#2D8A22" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- ═══════════════════════════════════════
       TAGLINE / نعرہ
       ═══════════════════════════════════════ -->
  <text x="250" y="540" text-anchor="middle"
        font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Alvi Nastaleeq', 'Segoe UI', Tahoma, serif"
        font-weight="700" font-size="24" fill="#0A3A82">
    اپنی زبان، اپنا کوڈ، اپنی پہچان
  </text>
</svg>
